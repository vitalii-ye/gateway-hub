[project]
name = "gateway"
version = "0.1.0"
description = "FastAPI ingestion gateway: authenticates API keys, tracks event status in Redis, publishes events to RabbitMQ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.3",
    "aio-pika>=9.4.4",
    "redis>=5.0.4",
    "python-dotenv>=1.2.2",
    "supabase>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "fakeredis>=2.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
